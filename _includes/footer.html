<footer class="site-footer">
    <div class="footer-content">
        <a href="{{ '/' | relative_url }}" class="footer-logo-link">
            <p class="footer-logo">rajath.blog</p>
        </a>

        {% comment %} A plain POST into a new tab: Buttondown's docs say not to
        fetch() the embed endpoint, because readers sometimes have to finish a
        CAPTCHA or fix a typo on Buttondown's own page. {% endcomment %}
        <label for="bd-email" class="visually-hidden">Get new posts by email</label>
        <form action="https://buttondown.com/api/emails/embed-subscribe/rajath" method="post" target="_blank" rel="noopener" class="newsletter-form" id="newsletter-subscribe">
            <input type="email" name="email" id="bd-email" placeholder="you@email.com" autocomplete="email" required>
            <button type="submit">Subscribe</button>
        </form>
        <p class="newsletter-done" role="status"></p>

        <div class="footer-bottom">
            <div class="social-links">
                <a href="https://x.com/rajath_c" target="_blank" rel="noopener">Twitter</a>
                <a href="https://www.linkedin.com/in/rajath-chandrahasa/" target="_blank" rel="noopener">LinkedIn</a>
                <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
            </div>
            <p class="copyright">© {{ site.author.name }}</p>
        </div>
    </div>
</footer>
