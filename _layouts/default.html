<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% if page.og_description %}
    <!-- Social-specific description; emitted before the seo tag so scrapers pick it first -->
    <meta property="og:description" content="{{ page.og_description }}" />
    <meta name="twitter:description" content="{{ page.og_description }}" />
    {% endif %}
    {% seo %}
    {% feed_meta %}
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#F5F5F5">
    <link rel="icon" type="image/svg+xml" href="{{ '/favicon.svg' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/main.min.css' | relative_url }}">

    <!-- Preload critical fonts -->
    <link rel="preload" href="/fonts/sligoil-main/fonts/web/Sligoil-Micro.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/oi/oi-v21-latin-regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/bricolage-grotesque/bricolage-grotesque-v9-latin-regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/bricolage-grotesque/bricolage-grotesque-v9-latin-700.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/bricolage-grotesque/bricolage-grotesque-v9-latin-800.woff2" as="font" type="font/woff2" crossorigin>

    <script>
        // Set theme before page renders to avoid flash
        // Check localStorage for user's saved choice, otherwise use system preference
        (function() {
            let storedTheme = null;
            try { storedTheme = localStorage.getItem('theme'); } catch (e) {}
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const theme = storedTheme || (prefersDark ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
            // Keep the browser chrome (address bar, overscroll) matched to the theme
            const tc = document.querySelector('meta[name="theme-color"]');
            if (tc) tc.setAttribute('content', theme === 'dark' ? '#1a1a1a' : '#F5F5F5');
        })();
    </script>

    <!-- Analytics (GA4 + Microsoft Clarity), injected after the load event so
         they never compete with fonts and the hero image for bandwidth -->
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        window.addEventListener('load', function () {
            var s = document.createElement('script');
            s.async = true;
            s.src = 'https://www.googletagmanager.com/gtag/js?id=G-YS570M83ND';
            document.head.appendChild(s);
            gtag('js', new Date());
            gtag('config', 'G-YS570M83ND');

            (function (c, l, a, r, i, t, y) {
                c[a] = c[a] || function () { (c[a].q = c[a].q || []).push(arguments) };
                t = l.createElement(r); t.async = 1; t.src = "https://www.clarity.ms/tag/" + i;
                y = l.getElementsByTagName(r)[0]; y.parentNode.insertBefore(t, y);
            })(window, document, "clarity", "script", "nb8atzyeik");
        });
    </script>
</head>
<body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <main class="main-content" id="main-content" tabindex="-1">
        {{ content }}
    </main>

    {% include footer.html %}

    <script src="{{ '/assets/js/theme-toggle.min.js' | relative_url }}" defer></script>
    <script src="{{ '/assets/js/tabs.min.js' | relative_url }}" defer></script>
    <script src="{{ '/assets/js/newsletter-animation.min.js' | relative_url }}" defer></script>
</body>
</html>
