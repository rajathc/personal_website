name: CI

# Build the site with the same builder GitHub Pages uses and validate it:
# internal links, image references (including srcset variants), and alt text.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify committed minified assets are fresh
        run: |
          test -f _includes/main.min.css || { echo "::error::_includes/main.min.css missing — run 'npm run minify' and commit it"; exit 1; }
          npm run minify
          git diff --exit-code -- assets _includes/main.min.css || {
            echo "::error::Minified assets are stale — run 'npm run minify' and commit the result"
            exit 1
          }

      - name: Build site (same builder as GitHub Pages)
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Check internal links, images, and alt text
        run: node scripts/check-site.js _site
