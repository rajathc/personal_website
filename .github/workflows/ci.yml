name: CI

# Build the site with the same builder GitHub Pages has always used
# (actions/jekyll-build-pages: the github-pages gem, Jekyll 3.10), validate
# it (internal links, image references including srcset variants, alt text,
# <picture> use, lazy loading, rel="noopener", fresh minified assets), and
# only then deploy that exact build to GitHub Pages. A failing check means
# nothing ships.
#
# Requires Settings > Pages > Build and deployment > Source: "GitHub Actions".
#
# Deploys run for pushes to main and for manual / dispatched runs on main.
# Commits pushed by the Optimize Images workflow use GITHUB_TOKEN, which does
# not trigger push workflows, so that workflow dispatches this one after it
# pushes (see optimize-images.yml).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# On main, queue runs instead of cancelling them, so deploys happen in order
# and an in-flight deployment is never cut off. Elsewhere, a newer push
# supersedes the older run.
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'pages' || format('ci-{0}', github.ref) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      # Only terser and clean-css are needed here; no install scripts.
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify committed minified assets are fresh
        run: |
          test -f _includes/main.min.css || { echo "::error::_includes/main.min.css missing — run 'npm run minify' and commit it"; exit 1; }
          npm run minify
          git diff --exit-code -- assets _includes/main.min.css || {
            echo "::error::Minified assets are stale — run 'npm run minify' and commit the result"
            exit 1
          }

      - name: Verify books.json is in canonical order
        run: node scripts/import-goodreads.js --check

      - name: Build site (same builder as GitHub Pages)
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Check links, images, alt text, lazy loading and rel=noopener
        run: node scripts/check-site.js _site

      - name: Upload site for GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

  deploy:
    needs: build-and-check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
