name: Optimize Images

# Safety net for post images pushed without running `npm run optimize`
# locally: generates the WebP variants and compressed fallbacks, commits
# them, and then dispatches CI, which validates and deploys the result.
#
# Trigger this workflow when:
# 1. Post images are added/modified in images/writings/
# 2. Manually via GitHub Actions UI
on:
  push:
    paths:
      # Only post images — the script only processes images/writings, so a push
      # to e.g. images/og-default.png must not trigger a pointless full run.
      # Path filters are case-sensitive; the brackets also match camera-style
      # names such as IMG_0001.JPG or Photo.Png.
      - 'images/writings/**/*.[jJ][pP][gG]'
      - 'images/writings/**/*.[jJ][pP][eE][gG]'
      - 'images/writings/**/*.[pP][nN][gG]'
      - 'images/writings/**/*.[gG][iI][fF]'
  workflow_dispatch:  # Allows manual trigger from GitHub UI

permissions:
  contents: write   # push the optimized images
  actions: write    # dispatch CI for the bot commit

# One run per branch at a time. A run that is already going is never
# cancelled (it may be mid-push); a newer queued run replaces an older queued
# one, and since the script scans the whole tree, nothing is lost.
concurrency:
  group: optimize-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  optimize:
    runs-on: ubuntu-latest

    # Skip if commit message contains [skip ci] to avoid infinite loops
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      # sharp ships prebuilt binaries as optional dependencies, so no install
      # scripts are needed.
      - name: Install dependencies (pinned via package-lock.json)
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run image optimization script
        run: node scripts/optimize-images.js

      - name: Check if images were optimized
        id: check_changes
        run: |
          if [ -d "images-optimized" ]; then
            echo "has_optimized=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_optimized=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Replace images with optimized versions
        if: steps.check_changes.outputs.has_optimized == 'true'
        run: |
          # Merge optimized images into existing directory.
          # Using rsync instead of rm+mv to preserve files the optimizer
          # doesn't handle (.avif, .webm, .mp4, etc.)
          rsync -av images-optimized/writings/ images/writings/
          rm -rf images-optimized

      - name: Commit and push optimized images
        id: commit
        if: steps.check_changes.outputs.has_optimized == 'true'
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add images/
          if git diff --staged --quiet; then
            echo "Nothing changed after optimization."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: optimize images [skip ci]

          - Compressed JPEG/PNG images
          - Generated WebP versions at 4 sizes (360px thumb, 800px, 1200px, 1920px)
          - Automated via GitHub Actions

          🤖 Generated by optimize-images workflow"

          # Someone may have pushed while this ran: rebase onto the latest
          # branch tip before pushing, and retry a couple of times.
          for attempt in 1 2 3; do
            if git pull --rebase origin "$BRANCH"; then
              if git push origin "HEAD:$BRANCH"; then
                echo "pushed=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            else
              git rebase --abort 2>/dev/null || true
            fi
            echo "Push attempt $attempt failed; retrying..."
            sleep $((attempt * 5))
          done
          echo "::error::Could not push the optimized images to $BRANCH"
          exit 1

      # Pushes made with GITHUB_TOKEN don't trigger other workflows, so the
      # bot commit would otherwise never be checked or deployed.
      - name: Run CI (check + deploy) on the optimized commit
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"

      - name: Summary
        if: steps.commit.outputs.pushed == 'true'
        run: |
          echo "✅ Images optimized and pushed; CI dispatched for $GITHUB_REF_NAME."
          echo "Check the commit for details on file size savings."
