# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'jekyll serve'. If you change this file, please restart the server process.

# Site settings
title:       Rajath Chandrahasa
tagline:     Product, travel, and books from Bengaluru
author:      Rajath Chandrahasa
email:       rajath@neosapien.xyz
description: 'Rajath Chandrahasa, a product manager in Bengaluru writing about technology, travel, books, and bringing creativity into tech.'
baseurl:     '' # The subpath of your site, e.g. /blog
url:         'https://rajath.blog' # The base hostname & protocol for your site

# Social metadata (read by jekyll-seo-tag for twitter:site and JSON-LD sameAs)
twitter:
  username: rajath_c
  card: summary_large_image
social:
  name: Rajath Chandrahasa
  links:
    - https://x.com/rajath_c
    - https://github.com/rajathc
    - https://www.linkedin.com/in/rajath-chandrahasa/

markdown:  kramdown
permalink: pretty
future:    true
timezone:  Asia/Kolkata

sass:
  style: compressed

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

# Ship excerpts (not full post HTML) in the Atom feed
feed:
  excerpt_only: true

include:
  - _pages

exclude:
  - vendor
  - Gemfile
  - Gemfile.lock
  - fonts/sligoil-main/documentation
  - fonts/sligoil-main/sources
  - fonts/sligoil-main/fonts/otf
  # LICENSE.txt stays published: OFL requires the license to accompany the served font
  - fonts/sligoil-main/METADATA.yml
  - fonts/sligoil-main/README.md
  - fonts/sligoil-main/COPYRIGHT.md
  - fonts/sligoil-main/TRADEMARKS.md
  - Image reference
  - Screenshots
  - Discog Screenshots
  - README.md
  - scripts
  - images-backup
  - node_modules
  - package.json
  - package-lock.json
  - IMAGE-OPTIMIZATION.md
  - GIF-CONVERSION.md
  - DESIGN_SYSTEM.md

# Front-matter defaults
defaults:
  # Sitewide og:image fallback. jekyll-seo-tag only reads page.image, so the
  # default must be set here (a top-level `image:` key is never read).
  # Posts override this with their own `image:` front matter.
  - scope:
      path: ''
    values:
      image: /images/og-default.png
  # Pages path
  - scope:
      path: '_pages'
    values:
      permalink: /:basename:output_ext
